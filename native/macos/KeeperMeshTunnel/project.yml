# Keeper Mesh's Network Extension variant for macOS: the packet tunnel system
# extension (Tunnel/) and the small tool Keeper runs to manage it (Manager/).
# XcodeGen makes the Xcode project from this file:  xcodegen generate
#
# NEEDS A DEVELOPER ID WITH THE NETWORK EXTENSION ENTITLEMENT. Fill in
# DEVELOPMENT_TEAM and the provisioning profiles; the extension goes into
# Keeper.app/Contents/Library/SystemExtensions/ and keeper-mesh-ne into
# Keeper.app/Contents/MacOS/, then Keeper.app is signed and notarised.
#
# WireGuardKit (wireguard-apple, MIT, Copyright WireGuard LLC) is used through
# Swift Package Manager, pinned to a commit. Its Go part (libwg-go.a, from
# wireguard-go, MIT) is built by the package's Makefile with a Go toolchain, as
# its README describes (an external build target named WireGuardGoBridge).
# Not compiled yet: there was no Swift toolchain where this was written.
name: KeeperMeshTunnel
options:
  bundleIdPrefix: org.ashforde.keeper
  deploymentTarget:
    macOS: "12.0"
packages:
  WireGuardKit:
    url: https://git.zx2c4.com/wireguard-apple
    revision: 2fec12a6e1f6e3460b6ee483aa00ad29cddadab1
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
targets:
  WireGuardGoBridge:
    type: ""
    platform: macOS
    legacy:
      toolPath: /usr/bin/make
      arguments: "-C ${BUILD_DIR}/../../SourcePackages/checkouts/wireguard-apple/Sources/WireGuardKitGo $(ACTION)"
      passSettings: true
  KeeperMeshTunnel:
    type: system-extension
    platform: macOS
    sources: [Tunnel]
    dependencies:
      - target: WireGuardGoBridge
      - package: WireGuardKit
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ashforde.keeper.mesh-tunnel
        PRODUCT_NAME: org.ashforde.keeper.mesh-tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/KeeperMeshTunnel.entitlements
        LIBRARY_SEARCH_PATHS: "$(inherited) ${BUILD_DIR}/../../SourcePackages/checkouts/wireguard-apple/Sources/WireGuardKitGo/out"
  keeper-mesh-ne:
    type: tool
    platform: macOS
    sources: [Manager]
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ashforde.keeper.mesh-ne
        CODE_SIGN_ENTITLEMENTS: Manager/Manager.entitlements
