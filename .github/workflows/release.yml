# SPDX-License-Identifier: AGPL-3.0-or-later
# Push a tag like v0.2.0 to build Keeper for every platform and processor and
# publish the installers, plus the update information installed copies read, as
# a GitHub Release. Tags with a hyphen (v0.3.0-beta.1) become pre-releases.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), runner: macos-latest, platform: darwin, arch: arm64, target: --mac }
          - { name: macOS (Intel), runner: macos-latest, platform: darwin, arch: x64, target: --mac }
          - { name: Windows (x64), runner: windows-latest, platform: win32, arch: x64, target: --win }
          - { name: Linux (x64), runner: ubuntu-latest, platform: linux, arch: x64, target: --linux }
          - { name: Linux (ARM64), runner: ubuntu-24.04-arm, platform: linux, arch: arm64, target: --linux }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npm test
      - name: Native libraries for ${{ matrix.platform }}-${{ matrix.arch }}
        run: node scripts/prepare-arch.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Both Mac builds write latest-mac.yml; Keeper updates Mac copies from the dmg itself,
      # so the per-processor file is kept under its own name instead of clashing.
      - if: runner.os == 'macOS'
        run: mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Keeper $version" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
