# SPDX-License-Identifier: LicenseRef-PolyForm-Shield-1.0.0
# Bump "version" in package.json on main (or push a tag like v0.2.0 that matches
# it) to build Keeper for every platform and processor and publish the
# installers, plus the update information installed copies read, as a GitHub
# Release; the release creates the tag. Versions with a hyphen (0.3.0-beta.1)
# become pre-releases. A push whose version already has a release builds nothing.
# Run it by hand (workflow_dispatch) with "Build only" to test the build without
# publishing. release-check.yml runs it that way as part of the gate before a release.
#
# Which systems a release covers comes from .github/release.json ("platforms": any of
# mac, windows, linux), or from the "platforms" input of a manual run. A system left out
# keeps its current version: no latest*.yml for it is published, so its installed copies
# are offered nothing, and the install scripts keep giving the newest release that has
# its files. Channels for a system left out are skipped (winget, Scoop and Chocolatey
# need Windows; the AUR, Snap and the apt/dnf repositories need Linux; the Homebrew cask
# needs macOS). See RELEASING.md.
#
# Who signs the Mac builds comes from .github/release.json ("macSigning"), or from the
# "mac_signing" input of a manual run, never from which secrets exist:
#   self-signed   the stable "Keeper Self-Signed" certificate (KEEPER_SIGNING_CERT /
#                 KEEPER_SIGNING_PASSWORD, scripts/make-signing-cert.sh), so macOS keeps
#                 Keeper's permissions across updates. CSC_LINK and the Developer ID secrets
#                 are not even passed to the build.
#   developer-id  Ashforde's Apple Developer ID, hardened runtime, notarized and stapled:
#                 KEEPER_DEVELOPER_ID_CERT -> CSC_LINK, KEEPER_DEVELOPER_ID_PASSWORD ->
#                 CSC_KEY_PASSWORD, APPLE_APP_PASSWORD -> APPLE_APP_SPECIFIC_PASSWORD, plus
#                 APPLE_ID and APPLE_TEAM_ID (a raw CSC_LINK / CSC_KEY_PASSWORD /
#                 APPLE_APP_SPECIFIC_PASSWORD is accepted in their place). A missing one fails
#                 the build; it never falls back to self-signed. Notarization is tracked by
#                 Apple's submission ID (scripts/notarize-mac.mjs, kept in the actions cache):
#                 a re-run waits on the same submission and never sends the app again. The wait
#                 is bounded by notary_budget_minutes (300) from the start of the Mac job,
#                 below its timeout-minutes (350). See RELEASING.md → Notarization.
# See RELEASING.md → Moving to the Developer ID for the order (the updater bridge ships first).
#
# Pre-releases are published on GitHub only (with their update information, for testers
# who switch on "Include beta versions"), never to Homebrew, winget, Chocolatey, Scoop,
# Snap, the AUR, npm or the apt/dnf repositories. See docs/BETA.md.
#
# Every channel job is skipped, with a notice saying why, when its secret is missing;
# a missing secret never fails the release. Commits this workflow adds to this
# repository go through the incoming branch, where sign-and-land.yml signs them as
# ashfordeOU (gh-pages commits are signed here with the same key), so every commit
# stays Verified.
#
# The msstore job also builds the Microsoft Store package (.msix) as a workflow artifact;
# it is uploaded to Partner Center by hand (docs/STORES.md), never attached to the release.
#
# Every release is certified for free: GitHub build attestations for each file,
# a Sigstore (cosign) signature of SHA256SUMS.txt, and, once KEEPER_GPG_PRIVATE_KEY
# exists, GPG signatures plus signed apt and dnf repositories. Platform signing
# (Apple Developer ID, Windows code signing) and the package-manager channels each
# switch on when their secret exists; with no secrets at all the release still works.
# See docs/INSTALL.md → Maintainers for every secret.
name: Release

on:
  push:
    # Bumping the version in package.json on main publishes that version.
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only (do not publish a release)
        type: boolean
        default: false
      platforms:
        description: 'Systems to release: "mac", "windows", "linux" (comma-separated) or "all"; empty = .github/release.json'
        type: string
        default: ''
      mac_signing:
        description: 'Who signs the Mac build ("release.json" = its "macSigning")'
        type: choice
        options: [release.json, self-signed, developer-id]
        default: release.json
      notary_budget_minutes:
        description: 'Developer ID: minutes a Mac job may wait for Apple to notarize (from the start of the job, at most 330)'
        type: number
        default: 300
  # release-check.yml builds everything this way, without publishing.
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true
      platforms:
        type: string
        default: ''
      mac_signing:
        type: string
        default: ''
      notary_budget_minutes:
        type: number
        default: 300

permissions:
  contents: write

# A release that has started always finishes: runs are never cancelled. Runs for
# the same commit (a version bump and its tag) wait for each other, so the second
# finds the release and skips.
concurrency:
  # (github.workflow keeps release-check.yml's build-only run apart.)
  group: release-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Which tag this run releases: the pushed tag, or v + package.json's version.
  tag:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      publish: ${{ steps.tag.outputs.publish }}
      build: ${{ steps.tag.outputs.build }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      mac: ${{ steps.platforms.outputs.mac }}
      windows: ${{ steps.platforms.outputs.windows }}
      linux: ${{ steps.platforms.outputs.linux }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      cli_from: ${{ steps.platforms.outputs.cli_from }}
      make_latest: ${{ steps.platforms.outputs.make_latest }}
      mac_signing: ${{ steps.signing.outputs.mac_signing }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::package.json says $version but the tag is $tag; they must match"
              exit 1
            fi
          else
            tag="v$version"
          fi
          publish=true
          if out="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>&1)"; then
            echo "Release $tag already exists; nothing to publish."
            publish=false
          elif ! printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "::error::Could not check for an existing release $tag: $out"
            exit 1
          fi
          build="$publish"
          if [ "$DRY_RUN" = true ]; then publish=false; build=true; fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
            echo "build=$build"
          } | tee -a "$GITHUB_OUTPUT"
      # Which systems this release covers, and the build matrix for them.
      - id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.platforms }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then list="$REQUESTED"; from="the platforms input"
          else list="$(jq -r '.platforms | join(",")' .github/release.json)"; from=".github/release.json"
          fi
          list="$(printf '%s' "$list" | tr 'A-Z ' 'a-z,')"
          [ "$list" = all ] && list="mac,windows,linux"
          mac=false; windows=false; linux=false
          for p in $(printf '%s' "$list" | tr ',' ' '); do
            case "$p" in
              mac|macos|darwin) mac=true ;;
              windows|win|win32) windows=true ;;
              linux) linux=true ;;
              *) echo "::error::Unknown platform \"$p\" in $from (use mac, windows, linux or all)"; exit 1 ;;
            esac
          done
          platforms=""
          [ "$mac" = true ] && platforms="$platforms,mac"
          [ "$windows" = true ] && platforms="$platforms,windows"
          [ "$linux" = true ] && platforms="$platforms,linux"
          platforms="${platforms#,}"
          [ -n "$platforms" ] || { echo "::error::$from names no platform"; exit 1; }
          # The build matrix: one entry per system and processor, kept to the systems released.
          matrix="$(jq -c --arg p ",$platforms," '{include: [.[] | select(.group as $g | $p | contains("," + $g + ","))]}' <<'MATRIX'
          [
            { "name": "macOS (Apple silicon)", "runner": "macos-latest", "platform": "darwin", "arch": "arm64", "target": "--mac", "group": "mac" },
            { "name": "macOS (Intel)", "runner": "macos-latest", "platform": "darwin", "arch": "x64", "target": "--mac", "group": "mac" },
            { "name": "Windows (x64)", "runner": "windows-latest", "platform": "win32", "arch": "x64", "target": "--win", "group": "windows" },
            { "name": "Linux (x64)", "runner": "ubuntu-latest", "platform": "linux", "arch": "x64", "target": "--linux", "group": "linux" },
            { "name": "Linux (ARM64)", "runner": "ubuntu-24.04-arm", "platform": "linux", "arch": "arm64", "target": "--linux", "group": "linux" }
          ]
          MATRIX
          )"
          # The keeper command (npm package, Homebrew formula) is plain JavaScript: built once, on a system that is released.
          if [ "$linux" = true ]; then cli_from="linux-x64"; elif [ "$mac" = true ]; then cli_from="darwin-arm64"; else cli_from="win32-x64"; fi
          # GitHub's "latest" release backs the README's download links, Flathub and the apt
          # source. A release for some systems only takes it over only while there is no
          # stable release yet (1.0.0); after that the last full release keeps it.
          make_latest=true
          if [ "$PRERELEASE" = true ]; then make_latest=false
          elif [ "$platforms" != "mac,windows,linux" ] && gh api "repos/$GITHUB_REPOSITORY/releases/latest" >/dev/null 2>&1; then make_latest=false
          fi
          if [ "$platforms" != "mac,windows,linux" ]; then
            echo "::notice title=Platforms::This release covers $platforms only (from $from). The others keep their current version."
          fi
          {
            echo "platforms=$platforms"
            echo "mac=$mac"
            echo "windows=$windows"
            echo "linux=$linux"
            echo "matrix=$matrix"
            echo "cli_from=$cli_from"
            echo "make_latest=$make_latest"
          } | tee -a "$GITHUB_OUTPUT"
      # Who signs the Mac build: .github/release.json's "macSigning" (default self-signed), or the
      # mac_signing input of a manual run. Never inferred from which secrets exist.
      - id: signing
        env:
          REQUESTED: ${{ inputs.mac_signing }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != release.json ]; then signing="$REQUESTED"; from="the mac_signing input"
          else signing="$(jq -r '.macSigning // "self-signed"' .github/release.json)"; from=".github/release.json"
          fi
          case "$signing" in
            self-signed|developer-id) ;;
            *) echo "::error::Unknown macSigning \"$signing\" in $from (use self-signed or developer-id)"; exit 1 ;;
          esac
          [ "$signing" = developer-id ] && echo "::notice title=Mac signing::Signed with the Apple Developer ID and notarized (from $from)."
          echo "mac_signing=$signing" | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: tag
    if: needs.tag.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    # macOS: notarization may wait hours in Apple's queue; the wait stops at notary_budget_minutes
    # (300) from the job's start, which leaves time to make the dmg, keep the submission IDs and upload.
    timeout-minutes: ${{ matrix.platform == 'darwin' && 350 || 360 }}
    strategy:
      fail-fast: false
      # Built by the tag job from .github/release.json (or the platforms input): only the systems released.
      matrix: ${{ fromJSON(needs.tag.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      # developer-id: the notarization wait ends at this deadline (the budget counts from the job's
      # start, so the job's timeout-minutes is never reached), and records belong to this commit.
      - name: Notarization budget
        if: matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id'
        shell: bash
        env:
          BUDGET: ${{ inputs.notary_budget_minutes }}
        run: |
          set -euo pipefail
          budget="${BUDGET:-300}"
          if ! [[ "$budget" =~ ^[0-9]+$ ]] || [ "$budget" -lt 1 ] || [ "$budget" -gt 330 ]; then
            echo "::error title=Notarization::notary_budget_minutes must be 1 to 330 (the Mac job stops at 350 minutes), not $budget"; exit 1
          fi
          deadline=$(( $(date +%s) + budget * 60 ))
          {
            echo "KEEPER_NOTARY_DEADLINE=$deadline"
            echo "KEEPER_NOTARY_COMMIT=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
          echo "Notarization may wait until $(date -u -r "$deadline" '+%H:%M UTC') ($budget minutes from now)."
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      # Electron 45 fetches its binary the first time it is loaded; fetch it once here, so parallel
      # test workers never race to download it.
      - run: node node_modules/electron/install.js
      # A release is built from a commit CI already tested: retry a test that fails once (timing on busy runners).
      - run: npm test -- --retry=2
      - name: Native libraries for ${{ matrix.platform }}-${{ matrix.arch }}
        run: node scripts/prepare-arch.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - run: npm run build
        env:
          # Marks the app as an official Ashforde build (anonymous usage stats report official: true).
          KEEPER_OFFICIAL_BUILD: '1'
          # Sign in with Google / Microsoft (mail, calendars): compiled in when these secrets exist; without
          # them the buttons are hidden and people use app passwords. A Google "Desktop app" client's secret
          # is not confidential (Google's own guidance for installed apps).
          KEEPER_GOOGLE_CLIENT_ID: ${{ secrets.KEEPER_GOOGLE_CLIENT_ID }}
          KEEPER_GOOGLE_CLIENT_SECRET: ${{ secrets.KEEPER_GOOGLE_CLIENT_SECRET }}
          KEEPER_MS_CLIENT_ID: ${{ secrets.KEEPER_MS_CLIENT_ID }}
          # A Developer ID build: the update window stops warning about the keychain question.
          KEEPER_DEVELOPER_ID: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && '1' || '' }}
      # Apple Intelligence, Live Text and Spotlight on macOS (universal, so either processor's build can carry it).
      # The same build as scripts/build-mac-native.mjs, which npm run dist:mac runs locally.
      - name: macOS helper
        if: matrix.platform == 'darwin'
        working-directory: native/macos/KeeperHelper
        run: swift build -c release --arch arm64 --arch x86_64
      # Siri, Spotlight and Shortcuts actions; optional (the app works without it).
      # Required for releases: the package check (scripts/verify-package.cjs) refuses a Mac app without it.
      - name: Siri and Shortcuts helper
        if: matrix.platform == 'darwin'
        run: native/macos/KeeperIntents/build.sh
      # self-signed: the same certificate every release keeps macOS permissions across updates
      # (build/after-sign.cjs signs with it). developer-id: every secret the Developer ID build
      # needs must be there, or the build stops here (no fallback to self-signed).
      - name: Signing certificate
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          MAC_SIGNING: ${{ needs.tag.outputs.mac_signing }}
          KEEPER_SIGNING_CERT: ${{ needs.tag.outputs.mac_signing == 'self-signed' && secrets.KEEPER_SIGNING_CERT || '' }}
          KEEPER_SIGNING_PASSWORD: ${{ needs.tag.outputs.mac_signing == 'self-signed' && secrets.KEEPER_SIGNING_PASSWORD || '' }}
          # developer-id only (the same mapping as the Package steps): whether each one is set, and the team.
          HAS_CERT: ${{ needs.tag.outputs.mac_signing == 'developer-id' && (secrets.KEEPER_DEVELOPER_ID_CERT != '' || secrets.CSC_LINK != '') }}
          HAS_CERT_PASSWORD: ${{ needs.tag.outputs.mac_signing == 'developer-id' && (secrets.KEEPER_DEVELOPER_ID_CERT != '' && secrets.KEEPER_DEVELOPER_ID_PASSWORD != '' || secrets.KEEPER_DEVELOPER_ID_CERT == '' && secrets.CSC_KEY_PASSWORD != '') }}
          HAS_APPLE_ID: ${{ needs.tag.outputs.mac_signing == 'developer-id' && secrets.APPLE_ID != '' }}
          HAS_APP_PASSWORD: ${{ needs.tag.outputs.mac_signing == 'developer-id' && (secrets.APPLE_APP_PASSWORD != '' || secrets.APPLE_APP_SPECIFIC_PASSWORD != '') }}
          APPLE_TEAM_ID: ${{ needs.tag.outputs.mac_signing == 'developer-id' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          if [ "$MAC_SIGNING" = developer-id ]; then
            missing=()
            [ "$HAS_CERT" = true ] || missing+=("KEEPER_DEVELOPER_ID_CERT")
            [ "$HAS_CERT_PASSWORD" = true ] || missing+=("KEEPER_DEVELOPER_ID_PASSWORD")
            [ "$HAS_APPLE_ID" = true ] || missing+=("APPLE_ID")
            [ -n "$APPLE_TEAM_ID" ] || missing+=("APPLE_TEAM_ID")
            [ "$HAS_APP_PASSWORD" = true ] || missing+=("APPLE_APP_PASSWORD")
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error title=Developer ID::macSigning is developer-id but these secrets are missing: ${missing[*]}. Add them, or set \"macSigning\": \"self-signed\" in .github/release.json. (RELEASING.md → Moving to the Developer ID)"
              exit 1
            fi
            team="$(node scripts/check-mac-signing.mjs --print team)"
            if [ "$APPLE_TEAM_ID" != "$team" ]; then
              echo "::error title=Developer ID::APPLE_TEAM_ID is not $team, the team installed copies accept (APPLE_TEAM_ID in core/update-verify.ts)"
              exit 1
            fi
            echo "Signing with the Developer ID of team $team; notarizing with APPLE_ID."
          elif [ -n "$KEEPER_SIGNING_CERT" ]; then
            bash scripts/ci-import-signing-cert.sh
          else
            echo "::warning::KEEPER_SIGNING_CERT is not set; this release is signed ad hoc, so macOS permissions (Accessibility, Screen Recording and the rest) must be re-granted after each update until KEEPER_SIGNING_CERT is set. Run scripts/make-signing-cert.sh once."
          fi
      # developer-id: the submissions an earlier attempt of this version made (records, and the zips
      # that were sent), so scripts/notarize-mac.mjs waits on them instead of sending the app again.
      - name: Notarization records from an earlier attempt
        if: matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id'
        uses: actions/cache/restore@v4
        with:
          path: .notary
          key: notary-${{ needs.tag.outputs.version }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: notary-${{ needs.tag.outputs.version }}-${{ matrix.arch }}-
      - name: Package
        shell: bash
        env:
          # Every piece (rclone, agent-desktop, Keeper Intents too) must be inside the package, or packaging stops.
          KEEPER_REQUIRE_ALL: '1'
          # The standard download is the core installer: ffmpeg, ONNX Runtime and rclone are left out
          # (staged for the next step) and downloaded when a feature needs them (docs/COMPONENTS.md).
          KEEPER_EDITION: core
          # macOS, developer-id only (self-signed never sees them, a CSC_LINK secret included):
          # KEEPER_DEVELOPER_ID_CERT -> CSC_LINK, KEEPER_DEVELOPER_ID_PASSWORD -> CSC_KEY_PASSWORD,
          # APPLE_APP_PASSWORD -> APPLE_APP_SPECIFIC_PASSWORD, APPLE_ID, APPLE_TEAM_ID.
          KEEPER_MAC_SIGNING: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing || '' }}
          CSC_LINK: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && (secrets.KEEPER_DEVELOPER_ID_CERT || secrets.CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && (secrets.KEEPER_DEVELOPER_ID_CERT != '' && secrets.KEEPER_DEVELOPER_ID_PASSWORD || secrets.CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && (secrets.APPLE_APP_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD) || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && secrets.APPLE_TEAM_ID || '' }}
          # Windows, all optional: without them Windows builds are unsigned.
          WIN_CSC_LINK: ${{ matrix.platform == 'win32' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win32' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ matrix.platform == 'win32' && vars.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ "$KEEPER_MAC_SIGNING" = developer-id ] && { [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
            echo "::error title=Developer ID::macSigning is developer-id but the certificate or the notarization secrets are missing"; exit 1
          fi
          [ "$KEEPER_MAC_SIGNING" = developer-id ] || unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          # An empty CSC_LINK is read as a file path ("… not a file"): only pass it when it is set.
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          [ -n "$WIN_CSC_LINK" ] || unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          config=electron-builder.yml
          if [ "$KEEPER_MAC_SIGNING" = developer-id ] || [ -n "$AZURE_TRUSTED_SIGNING_ACCOUNT" ]; then
            config=packaging/electron-builder.signed.cjs
          fi
          if [ -z "${CSC_LINK:-}" ] && [ -z "${WIN_CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          echo "Packaging with $config"
          # developer-id: build/after-sign.cjs notarizes the signed app with scripts/notarize-mac.mjs, which
          # sends it once, keeps the submission ID and retries only the waiting. Packaging is never repeated
          # here: a second electron-builder run would sign anew and send another app to Apple.
          npx electron-builder --config "$config" ${{ matrix.target }} --${{ matrix.arch }} --publish never
      # ---- Downloadable components (docs/COMPONENTS.md): from this very build, signed like the app on
      # macOS by build/after-sign.cjs, as keeper-component-<name>-<platform>-<arch>.tar.gz plus
      # components-<platform>-<arch>.json. SHA256SUMS.txt (and its Sigstore signature) covers them.
      - name: Downloadable components
        shell: bash
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          TARGET: ${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          node scripts/components.mjs pack --staging "release/components-staging/$TARGET" \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --version "$VERSION" --out release --require
          rm -rf release/components-staging
      # ---- The offline installer: the same build with every component inside, named …-full
      # (Keeper-mac-arm64-full.dmg, Keeper-setup-x64-full.exe, Keeper-linux-x86_64-full.AppImage and
      # Keeper-linux-x64-full.tar.gz). Its update information is not published: latest*.yml stays the
      # core build's, and an offline copy that updates downloads the parts it uses afterwards.
      - name: Offline installer (everything inside)
        shell: bash
        env:
          KEEPER_REQUIRE_ALL: '1'
          KEEPER_EDITION: full
          # The same signing as the core build: notarized too, as its own submission (its app holds the
          # components), unless its app is byte for byte one Apple already has.
          # macOS, developer-id only (self-signed never sees them, a CSC_LINK secret included):
          # KEEPER_DEVELOPER_ID_CERT -> CSC_LINK, KEEPER_DEVELOPER_ID_PASSWORD -> CSC_KEY_PASSWORD,
          # APPLE_APP_PASSWORD -> APPLE_APP_SPECIFIC_PASSWORD, APPLE_ID, APPLE_TEAM_ID.
          KEEPER_MAC_SIGNING: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing || '' }}
          CSC_LINK: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && (secrets.KEEPER_DEVELOPER_ID_CERT || secrets.CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && (secrets.KEEPER_DEVELOPER_ID_CERT != '' && secrets.KEEPER_DEVELOPER_ID_PASSWORD || secrets.CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && (secrets.APPLE_APP_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD) || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id' && secrets.APPLE_TEAM_ID || '' }}
          # Windows, all optional: without them Windows builds are unsigned.
          WIN_CSC_LINK: ${{ matrix.platform == 'win32' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win32' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ matrix.platform == 'win32' && vars.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ "$KEEPER_MAC_SIGNING" = developer-id ] && { [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
            echo "::error title=Developer ID::macSigning is developer-id but the certificate or the notarization secrets are missing"; exit 1
          fi
          [ "$KEEPER_MAC_SIGNING" = developer-id ] || unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          # An empty CSC_LINK is read as a file path ("… not a file"): only pass it when it is set.
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          [ -n "$WIN_CSC_LINK" ] || unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          config=electron-builder.yml
          if [ "$KEEPER_MAC_SIGNING" = developer-id ] || [ -n "$AZURE_TRUSTED_SIGNING_ACCOUNT" ]; then
            config=packaging/electron-builder.signed.cjs
          fi
          if [ -z "${CSC_LINK:-}" ] && [ -z "${WIN_CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          case "${{ matrix.platform }}" in
            darwin) targets="--mac dmg" ;;
            win32) targets="--win nsis" ;;
            *) targets="--linux AppImage tar.gz" ;;
          esac
          # Notarized by build/after-sign.cjs (scripts/notarize-mac.mjs), never packaged twice.
          # shellcheck disable=SC2086 # $targets is a list of words
          npx electron-builder --config "$config" $targets --${{ matrix.arch }} --publish never -c.directories.output=release-full
          shopt -s nullglob
          for f in release-full/*.dmg release-full/*.exe release-full/*.AppImage release-full/*.tar.gz; do
            base="$(basename "$f")"
            case "$base" in
              *.tar.gz) full="${base%.tar.gz}-full.tar.gz" ;;
              *) full="${base%.*}-full.${base##*.}" ;;
            esac
            mv "$f" "release/$full"
            echo "Offline installer: $full"
          done
          rm -rf release-full
      # developer-id: every dmg (core and full) is checked before upload: Developer ID of the team,
      # hardened runtime on the app and its helpers, stapled, accepted by Gatekeeper, and meeting
      # the requirement self-signed copies' updater bridge accepts (core/update-verify.ts).
      - name: Check the Developer ID signature
        if: runner.os == 'macOS' && needs.tag.outputs.mac_signing == 'developer-id'
        run: node scripts/check-mac-signing.mjs release/*.dmg
      # developer-id, also when a step above failed or the wait ran out: the submission IDs in the log,
      # then kept for a re-run (the cache: records and the zips sent, so the same app is put back and
      # its ID waited on) and as an artifact (the records).
      - name: Notarization IDs
        id: notary
        if: always() && matrix.platform == 'darwin' && needs.tag.outputs.mac_signing == 'developer-id'
        shell: bash
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          records=(.notary/*.json)
          if [ "${#records[@]}" -eq 0 ]; then echo "Nothing was sent to Apple in this job."; exit 0; fi
          jq -r '"\(.edition) \(.arch) \(.version): submission \(.id), \(.status // "In Progress"), sent \(.submittedAt)"' "${records[@]}"
          shas="$(jq -r --arg v "$VERSION" --arg a "$ARCH" 'select(.version == $v and .arch == $a) | .sha256[0:12]' "${records[@]}" | sort -u | paste -sd- -)"
          [ -z "$shas" ] || echo "key=notary-$VERSION-$ARCH-$shas" >> "$GITHUB_OUTPUT"
      - name: Keep the notarization records for a re-run
        if: always() && steps.notary.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: .notary
          key: ${{ steps.notary.outputs.key }}
      - if: always() && steps.notary.outputs.key != ''
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ matrix.platform }}-${{ matrix.arch }}
          path: .notary/*.json
          overwrite: true
          if-no-files-found: ignore
      # Both Mac builds write latest-mac.yml; Keeper updates Mac copies from the dmg itself,
      # so the per-processor file is kept under its own name instead of clashing.
      - if: runner.os == 'macOS'
        run: mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/latest*.yml
            release/*.blockmap
            release/components-*.json
          if-no-files-found: error
      # The keeper command on its own, for the npm package and the Homebrew formula
      # (from Linux x64, or the first released system when Linux is left out).
      - if: format('{0}-{1}', matrix.platform, matrix.arch) == needs.tag.outputs.cli_from
        uses: actions/upload-artifact@v4
        with:
          name: cli-bundle
          path: dist-cli/keeper.cjs
          if-no-files-found: error

  release:
    needs: [tag, build]
    if: needs.tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Sigstore signature and build attestations
      attestations: write
    outputs:
      tag: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      prerelease: ${{ needs.tag.outputs.prerelease }}
      repos: ${{ steps.repos.outputs.built }}
      manifests: ${{ steps.channels.outputs.manifests }}
      homebrew: ${{ steps.channels.outputs.homebrew }}
      npm: ${{ steps.channels.outputs.npm }}
      winget: ${{ steps.channels.outputs.winget }}
      choco: ${{ steps.channels.outputs.choco }}
      aur: ${{ steps.channels.outputs.aur }}
      snap: ${{ steps.channels.outputs.snap }}
      pages: ${{ steps.channels.outputs.pages }}
    env:
      KEEPER_GPG_PRIVATE_KEY: ${{ secrets.KEEPER_GPG_PRIVATE_KEY }}
      KEEPER_GPG_PASSPHRASE: ${{ secrets.KEEPER_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: meta
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: keeper-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cli-bundle
          path: cli-bundle
      - name: The keeper command as an npm package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/render-packaging.mjs --version "$VERSION" --only npm --cli cli-bundle/keeper.cjs --out packaging-out
          npm pack ./packaging-out/npm --pack-destination artifacts

      # ---- GPG (optional): signed apt and dnf repositories, built before the checksums so they cover them
      - name: Import the release signing key
        id: gpg
        if: env.KEEPER_GPG_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          if [ -n "$KEEPER_GPG_PASSPHRASE" ]; then
            printf '%s' "$KEEPER_GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass"
            printf 'pinentry-mode loopback\npassphrase-file %s\n' "$RUNNER_TEMP/gpg-pass" >> ~/.gnupg/gpg.conf
          fi
          printf '%s\n' "$KEEPER_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_OUTPUT"
      - name: apt and dnf repositories
        id: repos
        if: env.KEEPER_GPG_PRIVATE_KEY != '' && steps.meta.outputs.prerelease == 'false' && needs.tag.outputs.linux == 'true'
        env:
          KEEPER_GPG_KEY_ID: ${{ steps.gpg.outputs.fpr }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev createrepo-c
          sh packaging/repo/build-repos.sh artifacts pages-out "$RELEASE_VERSION"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: cd artifacts && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sigstore signature of the checksums (keyless, tied to this workflow)
        run: cosign sign-blob --yes --bundle artifacts/SHA256SUMS.txt.sigstore.json artifacts/SHA256SUMS.txt
      - name: GPG signatures
        if: env.KEEPER_GPG_PRIVATE_KEY != ''
        env:
          KEY: ${{ steps.gpg.outputs.fpr }}
        run: |
          cd artifacts
          for f in SHA256SUMS.txt *.AppImage; do
            [ -e "$f" ] || continue # no AppImage in a release without Linux
            gpg --batch --yes --local-user "$KEY" --armor --detach-sign -o "$f.asc" "$f"
          done
          ls -1 -- *.asc
      # Only the kinds of file this release has (a release without Linux has no AppImage):
      # a pattern that matches nothing would stop the attestation.
      - name: Files to attest
        id: subjects
        run: |
          {
            echo 'paths<<SUBJECTS'
            for f in artifacts/*.dmg artifacts/*.zip artifacts/*.exe artifacts/*.AppImage artifacts/*.deb artifacts/*.rpm artifacts/*.tar.gz artifacts/*.tgz artifacts/SHA256SUMS.txt; do
              [ -e "$f" ] && echo "$f"
            done
            echo SUBJECTS
          } >> "$GITHUB_OUTPUT"
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}
      # .github/release-notes/<version>.md when it exists, else the CHANGELOG section; long
      # notes fold their long sections; then the platforms line and the install notes.
      # A developer-id release says so in its notes (and marks them, so self-signed copies warn
      # that macOS asks once more; core/update-verify.ts).
      - name: Release notes
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          PLATFORMS: ${{ needs.tag.outputs.platforms }}
          MAC_SIGNING: ${{ needs.tag.outputs.mac_signing }}
        run: |
          node .github/scripts/release-notes.mjs --version "$RELEASE_VERSION" --platforms "$PLATFORMS" --mac-signing "$MAC_SIGNING" --out notes.md
          wc -c notes.md
      # Creates the tag on the commit that was built when it does not exist yet.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.tag.outputs.make_latest }}

      # ---- Manifests for the package managers, and which channels have their secret
      # Only the channels of the systems in this release (the others' files are not in SHA256SUMS.txt).
      - name: Package-manager manifests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MAC: ${{ needs.tag.outputs.mac }}
          WINDOWS: ${{ needs.tag.outputs.windows }}
          LINUX: ${{ needs.tag.outputs.linux }}
        run: |
          only=npm
          [ "$MAC" = true ] && only="$only,homebrew"
          [ "$WINDOWS" = true ] && only="$only,scoop,winget,chocolatey"
          [ "$LINUX" = true ] && only="$only,aur,flatpak"
          node scripts/render-packaging.mjs --version "$VERSION" --sums artifacts/SHA256SUMS.txt --cli cli-bundle/keeper.cjs --out packaging-out --only "$only"
          cp artifacts/keeper-cli-*.tgz packaging-out/
      - uses: actions/upload-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - if: steps.repos.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: pages-out
          include-hidden-files: true
      # Which channels run: a stable release, the channel's system in this release, and its
      # secret. Each one that does not run says why in a notice; none of them fails the release.
      - id: channels
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          MAC: ${{ needs.tag.outputs.mac }}
          WINDOWS: ${{ needs.tag.outputs.windows }}
          LINUX: ${{ needs.tag.outputs.linux }}
          REPOS: ${{ steps.repos.outputs.built }}
          COMMIT_SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          GPG_KEY: ${{ secrets.KEEPER_GPG_PRIVATE_KEY }}
        run: |
          # channel output-name title system-included system-name secret secret-name
          channel() {
            on=true
            if [ "$PRERELEASE" = true ]; then on=false
            elif [ "$3" != true ]; then on=false; echo "::notice title=$2 skipped::this release has no $4 build"
            elif [ -z "$5" ]; then on=false; echo "::notice title=$2 skipped::the $6 secret is not set (see RELEASING.md)"
            fi
            echo "$1=$on" | tee -a "$GITHUB_OUTPUT"
          }
          [ "$PRERELEASE" = true ] && echo "::notice title=Channels skipped::a pre-release goes to GitHub only"
          macwin=false; if [ "$MAC" = true ] || [ "$WINDOWS" = true ]; then macwin=true; fi
          linuxrepos=false; if [ "$LINUX" = true ] && [ "$REPOS" = true ]; then linuxrepos=true; fi
          if [ "$LINUX" = true ] && [ "$PRERELEASE" = false ] && [ -z "$GPG_KEY" ]; then
            echo "::notice title=GPG signatures, apt and dnf repositories skipped::the KEEPER_GPG_PRIVATE_KEY secret is not set (see RELEASING.md)"
          fi
          channel manifests 'Casks/keeper.rb and the Scoop bucket' "$macwin" 'macOS or Windows' "$COMMIT_SIGNING_KEY" COMMIT_SIGNING_KEY
          channel homebrew 'Homebrew tap' "$MAC" macOS "$HOMEBREW_TAP_TOKEN" HOMEBREW_TAP_TOKEN
          channel npm 'npm keeper-cli' true any "$NPM_TOKEN" NPM_TOKEN
          channel winget winget "$WINDOWS" Windows "$WINGET_TOKEN" WINGET_TOKEN
          channel choco Chocolatey "$WINDOWS" Windows "$CHOCO_API_KEY" CHOCO_API_KEY
          channel aur AUR "$LINUX" Linux "$AUR_SSH_KEY" AUR_SSH_KEY
          channel snap 'Snap Store' "$LINUX" Linux "$SNAPCRAFT_STORE_CREDENTIALS" SNAPCRAFT_STORE_CREDENTIALS
          channel pages 'dnf repository on gh-pages' "$linuxrepos" 'Linux (with KEEPER_GPG_PRIVATE_KEY)' "$COMMIT_SIGNING_KEY" COMMIT_SIGNING_KEY

  # ---- Channels. Each runs only for a stable release that includes its system, and only
  # when its secret exists (the release job's channels step says which, and why not).

  # Casks/keeper.rb (brew tap ashfordeOU/keeper https://github.com/ashfordeOU/keeper) and
  # bucket/keeper.json (the Scoop bucket) in this repository. The commit is made as
  # ashfordeOU on top of the incoming branch, and sign-and-land.yml signs it with
  # COMMIT_SIGNING_KEY and moves main, so it is Verified like every other commit there.
  # It does not touch package.json, so it starts no release.
  manifests:
    needs: [tag, release]
    if: needs.release.outputs.manifests == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to incoming
      actions: write # start sign-and-land.yml (pushes made with this token start no workflows)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: ${{ runner.temp }}/packaging-out
      - name: Commit the cask and the bucket to incoming
        id: push
        env:
          VERSION: ${{ needs.release.outputs.version }}
          MAC: ${{ needs.tag.outputs.mac }}
          WINDOWS: ${{ needs.tag.outputs.windows }}
          OUT: ${{ runner.temp }}/packaging-out
        run: |
          set -euo pipefail
          git config user.name ashfordeOU
          git config user.email 236818772+ashfordeOU@users.noreply.github.com
          what=()
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            # incoming is main plus whatever is waiting to be signed; start from it when it builds on main.
            base=origin/main
            if git fetch -q origin incoming 2>/dev/null && git merge-base --is-ancestor origin/main origin/incoming; then base=origin/incoming; fi
            git checkout -q --detach "$base"
            what=()
            if [ "$MAC" = true ]; then mkdir -p Casks; cp "$OUT/homebrew/Casks/keeper.rb" Casks/keeper.rb; git add Casks/keeper.rb; what+=("Homebrew"); fi
            if [ "$WINDOWS" = true ]; then mkdir -p bucket; cp "$OUT/scoop/keeper.json" bucket/keeper.json; git add bucket/keeper.json; what+=("Scoop"); fi
            if git diff --cached --quiet; then echo "Casks/keeper.rb and bucket/keeper.json are up to date."; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            label="${what[0]}"; [ "${#what[@]}" -gt 1 ] && label="${what[0]} and ${what[1]}"
            git commit -q -m "$label: Keeper $VERSION [skip ci]"
            if git push origin HEAD:refs/heads/incoming; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the cask and bucket update to incoming"
          exit 1
      - name: Sign and land it on main
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sign-and-land.yml --ref incoming --repo "$GITHUB_REPOSITORY"

  # The ashfordeOU/homebrew-keeper tap (brew install --cask ashfordeou/keeper/keeper), when its token exists.
  homebrew:
    needs: release
    if: needs.release.outputs.homebrew == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - uses: actions/checkout@v5
        with:
          repository: ashfordeOU/homebrew-keeper
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      # Committed as ashfordeOU, and signed with COMMIT_SIGNING_KEY when it is set (Verified on GitHub).
      - name: Update the cask and the formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p tap/Casks tap/Formula
          cp packaging-out/homebrew/Casks/keeper.rb tap/Casks/keeper.rb
          cp packaging-out/homebrew/Formula/keeper-cli.rb tap/Formula/keeper-cli.rb
          cd tap
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name ashfordeOU
          git config user.email 236818772+ashfordeOU@users.noreply.github.com
          if [ -n "$SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/signing_key"
            install -m 600 /dev/null "$key"
            printf '%s\n' "$SIGNING_KEY" > "$key"
            git config gpg.format ssh
            git config user.signingkey "$key"
            git config commit.gpgsign true
          else
            echo "::notice title=Homebrew tap::COMMIT_SIGNING_KEY is not set, so the tap commit is not signed"
          fi
          git commit -m "Keeper $VERSION"
          git push
          rm -f "$RUNNER_TEMP/signing_key"

  npm:
    needs: release
    if: needs.release.outputs.npm == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - name: Publish keeper-cli with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish packaging-out/keeper-cli-*.tgz --provenance --access public --tag latest

  winget:
    needs: release
    if: needs.release.outputs.winget == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      # Opens a pull request to microsoft/winget-pkgs from the token owner's fork.
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Ashforde.Keeper
          installers-regex: 'Keeper-setup-x64\.exe$'
          release-tag: ${{ needs.release.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}

  chocolatey:
    needs: release
    if: needs.release.outputs.choco == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - name: Pack and push keeper-files
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd packaging-out/chocolatey
          choco pack keeper-files.nuspec
          choco push "keeper-files.$env:VERSION.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

  aur:
    needs: release
    if: needs.release.outputs.aur == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: keeper-bin
          pkgbuild: packaging-out/aur/keeper-bin/PKGBUILD
          commit_username: ashfordeOU
          commit_email: 236818772+ashfordeOU@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: Keeper ${{ needs.release.outputs.version }}

  snap:
    needs: release
    if: needs.release.outputs.snap == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - run: npm ci
      # Electron 45 fetches its binary the first time it is loaded; fetch it once here, so parallel
      # test workers never race to download it.
      - run: node node_modules/electron/install.js
      - run: node scripts/prepare-arch.mjs linux x64
      - run: npm run build
        env:
          # Marks the app as an official Ashforde build (anonymous usage stats report official: true).
          KEEPER_OFFICIAL_BUILD: '1'
      - run: npx electron-builder --linux snap --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: sudo snap install snapcraft --classic
      - run: snapcraft upload --release=stable release/Keeper-linux-amd64.snap

  # ---- Microsoft Store package (.msix), built for every tag and kept as a workflow artifact
  # (not attached to the release, not submitted). Unsigned: the Store signs what it publishes.
  # The package identity comes from the repository variables MSSTORE_IDENTITY_NAME and
  # MSSTORE_PUBLISHER (Partner Center → Product identity); without them the placeholders in
  # electron-builder.yml are used, which is fine for checking the build but not for uploading.
  msstore:
    name: Microsoft Store (MSIX)
    needs: tag
    if: needs.tag.outputs.build == 'true' && needs.tag.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Native libraries for win32-x64
        run: node scripts/prepare-arch.mjs win32 x64
      - run: npm run build
        env:
          KEEPER_OFFICIAL_BUILD: '1'
      - name: Store tiles and logos are present and the right sizes
        run: node scripts/store-assets.mjs --check
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
        run: |
          extra=()
          if [ -n "$MSSTORE_IDENTITY_NAME" ]; then extra+=("-c.appx.identityName=$MSSTORE_IDENTITY_NAME"); fi
          if [ -n "$MSSTORE_PUBLISHER" ]; then extra+=("-c.appx.publisher=$MSSTORE_PUBLISHER"); fi
          if [ -z "$MSSTORE_IDENTITY_NAME" ] || [ -z "$MSSTORE_PUBLISHER" ]; then
            echo "::warning::MSSTORE_IDENTITY_NAME or MSSTORE_PUBLISHER is not set; this .msix has placeholder identity values and Partner Center will refuse it."
          fi
          npx electron-builder --config electron-builder.yml --win appx --x64 --publish never "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: msstore-x64
          path: release/*.msix
          if-no-files-found: error

  # The dnf repository and the public key, stored on the gh-pages branch. The commit is made
  # as ashfordeOU and signed here with COMMIT_SIGNING_KEY, so gh-pages stays Verified too.
  # GitHub Pages deploys from Actions (site.yml), which copies rpm/ and keeper-release.asc
  # from this branch into the website; the website job below starts that deploy.
  pages:
    needs: release
    if: needs.release.outputs.pages == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pages
          path: ${{ runner.temp }}/pages-out
      - name: Publish the dnf repository and the signing key to gh-pages
        env:
          SRC: ${{ runner.temp }}/pages-out
          VERSION: ${{ needs.release.outputs.version }}
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages && git switch gh-pages
          else
            git switch --orphan gh-pages
          fi
          rm -rf rpm/repodata
          cp -r "$SRC"/. .
          git add -A
          git diff --cached --quiet && exit 0
          key="$RUNNER_TEMP/signing_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          git config user.name ashfordeOU
          git config user.email 236818772+ashfordeOU@users.noreply.github.com
          git config gpg.format ssh
          git config user.signingkey "$key"
          git commit -S -m "Package repositories for Keeper $VERSION"
          git push origin gh-pages
          rm -f "$key"

  # Deploys the website again after every published release, so its download links, the
  # changelog and the package repositories show the new version. A release made with the
  # workflow token starts no workflows by itself, so this starts site.yml by hand.
  website:
    needs: [release, pages]
    if: always() && needs.release.result == 'success' && needs.pages.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main --repo "$GITHUB_REPOSITORY"
