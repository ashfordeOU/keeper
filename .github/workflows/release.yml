# SPDX-License-Identifier: LicenseRef-PolyForm-Shield-1.0.0
# Bump "version" in package.json on main (or push a tag like v0.2.0 that matches
# it) to build Keeper for every platform and processor and publish the
# installers, plus the update information installed copies read, as a GitHub
# Release; the release creates the tag. Versions with a hyphen (0.3.0-beta.1)
# become pre-releases. A push whose version already has a release builds nothing.
# Run it by hand (workflow_dispatch) with "Build only" to test the build without
# publishing.
#
# Mac builds are signed with the stable "Keeper Self-Signed" certificate once
# KEEPER_SIGNING_CERT / KEEPER_SIGNING_PASSWORD exist (scripts/make-signing-cert.sh),
# so macOS keeps Keeper's permissions across updates.
#
# Every release is certified for free: GitHub build attestations for each file,
# a Sigstore (cosign) signature of SHA256SUMS.txt, and, once KEEPER_GPG_PRIVATE_KEY
# exists, GPG signatures plus signed apt and dnf repositories. Platform signing
# (Apple Developer ID, Windows code signing) and the package-manager channels each
# switch on when their secret exists; with no secrets at all the release still works.
# See docs/INSTALL.md → Maintainers for every secret.
name: Release

on:
  push:
    # Bumping the version in package.json on main publishes that version.
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only (do not publish a release)
        type: boolean
        default: false

permissions:
  contents: write

# A release that has started always finishes: runs are never cancelled. Runs for
# the same commit (a version bump and its tag) wait for each other, so the second
# finds the release and skips.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Which tag this run releases: the pushed tag, or v + package.json's version.
  tag:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      publish: ${{ steps.tag.outputs.publish }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::package.json says $version but the tag is $tag; they must match"
              exit 1
            fi
          else
            tag="v$version"
          fi
          publish=true
          if out="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>&1)"; then
            echo "Release $tag already exists; nothing to publish."
            publish=false
          elif ! printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "::error::Could not check for an existing release $tag: $out"
            exit 1
          fi
          build="$publish"
          if [ "$DRY_RUN" = true ]; then publish=false; build=true; fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
            echo "build=$build"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: tag
    if: needs.tag.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), runner: macos-latest, platform: darwin, arch: arm64, target: --mac }
          - { name: macOS (Intel), runner: macos-latest, platform: darwin, arch: x64, target: --mac }
          - { name: Windows (x64), runner: windows-latest, platform: win32, arch: x64, target: --win }
          - { name: Linux (x64), runner: ubuntu-latest, platform: linux, arch: x64, target: --linux }
          - { name: Linux (ARM64), runner: ubuntu-24.04-arm, platform: linux, arch: arm64, target: --linux }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      # A release is built from a commit CI already tested: retry a test that fails once (timing on busy runners).
      - run: npm test -- --retry=2
      - name: Native libraries for ${{ matrix.platform }}-${{ matrix.arch }}
        run: node scripts/prepare-arch.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - run: npm run build
        env:
          # Marks the app as an official Ashforde build (anonymous usage stats report official: true).
          KEEPER_OFFICIAL_BUILD: '1'
      # Apple Intelligence, Live Text and Spotlight on macOS (universal, so either processor's build can carry it).
      # The same build as scripts/build-mac-native.mjs, which npm run dist:mac runs locally.
      - name: macOS helper
        if: matrix.platform == 'darwin'
        working-directory: native/macos/KeeperHelper
        run: swift build -c release --arch arm64 --arch x86_64
      # Siri, Spotlight and Shortcuts actions; optional (the app works without it).
      # Required for releases: the package check (scripts/verify-package.cjs) refuses a Mac app without it.
      - name: Siri and Shortcuts helper
        if: matrix.platform == 'darwin'
        run: native/macos/KeeperIntents/build.sh
      # The same certificate every release keeps macOS permissions across updates
      # (build/after-sign.cjs signs with it). A Developer ID (CSC_LINK) takes precedence.
      - name: Signing certificate
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          KEEPER_SIGNING_CERT: ${{ secrets.KEEPER_SIGNING_CERT }}
          KEEPER_SIGNING_PASSWORD: ${{ secrets.KEEPER_SIGNING_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Signing with the Developer ID certificate from CSC_LINK."
          elif [ -n "$KEEPER_SIGNING_CERT" ]; then
            bash scripts/ci-import-signing-cert.sh
          else
            echo "::warning::KEEPER_SIGNING_CERT is not set; this release is signed ad hoc, so macOS permissions (Accessibility, Screen Recording and the rest) must be re-granted after each update until KEEPER_SIGNING_CERT is set. Run scripts/make-signing-cert.sh once."
          fi
      - name: Package
        shell: bash
        env:
          # Every piece (rclone, Keeper Intents too) must be inside the package, or packaging stops.
          KEEPER_REQUIRE_ALL: '1'
          # All optional. Without them macOS builds are ad-hoc signed and Windows builds unsigned.
          CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win32' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win32' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ matrix.platform == 'win32' && vars.AZURE_TRUSTED_SIGNING_ACCOUNT || '' }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          # An empty CSC_LINK is read as a file path ("… not a file"): only pass it when it is set.
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          [ -n "$WIN_CSC_LINK" ] || unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          config=electron-builder.yml
          if [ -n "${CSC_LINK:-}" ] || [ -n "$AZURE_TRUSTED_SIGNING_ACCOUNT" ]; then
            config=packaging/electron-builder.signed.cjs
          fi
          if [ -z "${CSC_LINK:-}" ] && [ -z "${WIN_CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          echo "Packaging with $config"
          npx electron-builder --config "$config" ${{ matrix.target }} --${{ matrix.arch }} --publish never
      # Both Mac builds write latest-mac.yml; Keeper updates Mac copies from the dmg itself,
      # so the per-processor file is kept under its own name instead of clashing.
      - if: runner.os == 'macOS'
        run: mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
      # The keeper command on its own, for the npm package and the Homebrew formula.
      - if: matrix.platform == 'linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: cli-bundle
          path: dist-cli/keeper.cjs
          if-no-files-found: error

  release:
    needs: [tag, build]
    if: needs.tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Sigstore signature and build attestations
      attestations: write
    outputs:
      tag: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      prerelease: ${{ needs.tag.outputs.prerelease }}
      repos: ${{ steps.repos.outputs.built }}
      homebrew: ${{ steps.channels.outputs.homebrew }}
      npm: ${{ steps.channels.outputs.npm }}
      winget: ${{ steps.channels.outputs.winget }}
      choco: ${{ steps.channels.outputs.choco }}
      aur: ${{ steps.channels.outputs.aur }}
      snap: ${{ steps.channels.outputs.snap }}
    env:
      KEEPER_GPG_PRIVATE_KEY: ${{ secrets.KEEPER_GPG_PRIVATE_KEY }}
      KEEPER_GPG_PASSPHRASE: ${{ secrets.KEEPER_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: meta
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: keeper-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cli-bundle
          path: cli-bundle
      - name: The keeper command as an npm package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/render-packaging.mjs --version "$VERSION" --only npm --cli cli-bundle/keeper.cjs --out packaging-out
          npm pack ./packaging-out/npm --pack-destination artifacts

      # ---- GPG (optional): signed apt and dnf repositories, built before the checksums so they cover them
      - name: Import the release signing key
        id: gpg
        if: env.KEEPER_GPG_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          if [ -n "$KEEPER_GPG_PASSPHRASE" ]; then
            printf '%s' "$KEEPER_GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass"
            printf 'pinentry-mode loopback\npassphrase-file %s\n' "$RUNNER_TEMP/gpg-pass" >> ~/.gnupg/gpg.conf
          fi
          printf '%s\n' "$KEEPER_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_OUTPUT"
      - name: apt and dnf repositories
        id: repos
        if: env.KEEPER_GPG_PRIVATE_KEY != '' && steps.meta.outputs.prerelease == 'false'
        env:
          KEEPER_GPG_KEY_ID: ${{ steps.gpg.outputs.fpr }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev createrepo-c
          sh packaging/repo/build-repos.sh artifacts pages-out "$RELEASE_VERSION"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: cd artifacts && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sigstore signature of the checksums (keyless, tied to this workflow)
        run: cosign sign-blob --yes --bundle artifacts/SHA256SUMS.txt.sigstore.json artifacts/SHA256SUMS.txt
      - name: GPG signatures
        if: env.KEEPER_GPG_PRIVATE_KEY != ''
        env:
          KEY: ${{ steps.gpg.outputs.fpr }}
        run: |
          cd artifacts
          for f in SHA256SUMS.txt *.AppImage; do gpg --batch --yes --local-user "$KEY" --armor --detach-sign -o "$f.asc" "$f"; done
          ls -1 -- *.asc
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.tar.gz
            artifacts/*.tgz
            artifacts/SHA256SUMS.txt
      - name: Release notes from the changelog
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          awk -v v="$RELEASE_VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Keeper $RELEASE_VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          On a Mac, from Terminal:
          ```bash
          curl -fsSL https://raw.githubusercontent.com/ashfordeOU/keeper/main/scripts/install.sh | sh
          ```
          Or download the file for your system below. Copies already installed update themselves.
          If macOS says it cannot verify the developer, open **System Settings → Privacy & Security** and click **Open Anyway**.
          NOTES
      # Creates the tag on the commit that was built when it does not exist yet.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}

      # ---- Manifests for the package managers, and which channels have their secret
      - name: Package-manager manifests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/render-packaging.mjs --version "$VERSION" --sums artifacts/SHA256SUMS.txt --cli cli-bundle/keeper.cjs --out packaging-out
          cp artifacts/keeper-cli-*.tgz packaging-out/
      - uses: actions/upload-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - if: steps.repos.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: pages-out
          include-hidden-files: true
      - id: channels
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          has() { if [ -n "$2" ]; then echo "$1=true"; else echo "$1=false"; fi; }
          {
            has homebrew "$HOMEBREW_TAP_TOKEN"
            has npm "$NPM_TOKEN"
            has winget "$WINGET_TOKEN"
            has choco "$CHOCO_API_KEY"
            has aur "$AUR_SSH_KEY"
            has snap "$SNAPCRAFT_STORE_CREDENTIALS"
          } | tee -a "$GITHUB_OUTPUT"

  # ---- Channels. Each runs only when its secret exists; stable releases only, except npm (tag "next").
  scoop:
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    continue-on-error: true # a protected default branch only means the bucket waits for a manual update
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - name: Update bucket/keeper.json
        run: |
          cp packaging-out/scoop/keeper.json bucket/keeper.json
          git diff --quiet && exit 0
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -am "Scoop: Keeper ${{ needs.release.outputs.version }}"
          git push

  # Casks/keeper.rb in this repository (brew tap ashfordeOU/keeper https://github.com/ashfordeOU/keeper).
  # Runs after the Scoop bucket so the two commits to the default branch never race. The
  # commit cannot start another release: it does not touch package.json, and pushes made
  # with the workflow's token start no workflows.
  cask:
    needs: [release, scoop]
    if: always() && needs.release.result == 'success' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - name: Update Casks/keeper.rb
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p Casks
          cp packaging-out/homebrew/Casks/keeper.rb Casks/keeper.rb
          git add Casks/keeper.rb
          git diff --cached --quiet && exit 0
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -m "Homebrew: Keeper $VERSION [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push Casks/keeper.rb to $BRANCH"
          exit 1

  # The ashfordeOU/homebrew-keeper tap (brew install --cask ashfordeou/keeper/keeper), when its token exists.
  homebrew:
    needs: release
    if: needs.release.outputs.homebrew == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - uses: actions/checkout@v5
        with:
          repository: ashfordeOU/homebrew-keeper
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the cask and the formula
        run: |
          mkdir -p tap/Casks tap/Formula
          cp packaging-out/homebrew/Casks/keeper.rb tap/Casks/keeper.rb
          cp packaging-out/homebrew/Formula/keeper-cli.rb tap/Formula/keeper-cli.rb
          cd tap
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -m "Keeper ${{ needs.release.outputs.version }}"
          git push

  npm:
    needs: release
    if: needs.release.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - name: Publish keeper-cli with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ needs.release.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish packaging-out/keeper-cli-*.tgz --provenance --access public --tag "$TAG"

  winget:
    needs: release
    if: needs.release.outputs.winget == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      # Opens a pull request to microsoft/winget-pkgs from the token owner's fork.
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Ashforde.Keeper
          installers-regex: 'Keeper-setup-x64\.exe$'
          release-tag: ${{ needs.release.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}

  chocolatey:
    needs: release
    if: needs.release.outputs.choco == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - name: Pack and push keeper-files
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd packaging-out/chocolatey
          choco pack keeper-files.nuspec
          choco push "keeper-files.$env:VERSION.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

  aur:
    needs: release
    if: needs.release.outputs.aur == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging-out
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: keeper-bin
          pkgbuild: packaging-out/aur/keeper-bin/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: Keeper ${{ needs.release.outputs.version }}

  snap:
    needs: release
    if: needs.release.outputs.snap == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - run: npm ci
      - run: node scripts/prepare-arch.mjs linux x64
      - run: npm run build
        env:
          # Marks the app as an official Ashforde build (anonymous usage stats report official: true).
          KEEPER_OFFICIAL_BUILD: '1'
      - run: npx electron-builder --linux snap --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: sudo snap install snapcraft --classic
      - run: snapcraft upload --release=stable release/Keeper-linux-amd64.snap

  pages:
    needs: release
    if: needs.release.outputs.repos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pages
          path: ${{ runner.temp }}/pages-out
      - name: Publish the dnf repository and the signing key to gh-pages
        env:
          SRC: ${{ runner.temp }}/pages-out
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages && git switch gh-pages
          else
            git switch --orphan gh-pages
          fi
          rm -rf rpm/repodata
          cp -r "$SRC"/. .
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -m "Package repositories for Keeper ${{ needs.release.outputs.version }}"
          git push origin gh-pages
