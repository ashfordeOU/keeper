# SPDX-License-Identifier: LicenseRef-PolyForm-Shield-1.0.0
# One-off, started by hand: signs every commit on every branch (and every tag) with
# Ashforde's commit-signing key, so the whole history shows as Verified. Contents,
# authors, committers, dates and messages stay exactly as they were; only the
# signature is added, so every commit gets a new id. every branch and
# tag is then force-pushed.
name: Re-sign history

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "re-sign main" to rewrite every branch and tag'
        required: true

permissions:
  contents: write

concurrency:
  group: sign-and-land
  cancel-in-progress: false

jobs:
  resign:
    if: inputs.confirm == 're-sign main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Sign every commit and tag
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
          FILTER_BRANCH_SQUELCH_WARNING: '1'
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "::error::COMMIT_SIGNING_KEY is not set"; exit 1; }
          key="$RUNNER_TEMP/signing_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          git config gpg.format ssh
          git config user.signingkey "$key"
          # Trust the key for checking the result below (any committer address).
          printf '* namespaces="git" %s\n' "$(ssh-keygen -y -f "$key")" > "$RUNNER_TEMP/allowed_signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          # Every branch and every tag, each as a local ref.
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q --detach
          branches="$(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$')"
          for b in $branches; do git branch -f "$b" "origin/$b"; done
          for b in $branches; do echo "$b before: $(git rev-parse "$b") ($(git rev-list --count "$b") commits)"; done
          # commit-tree -S signs; filter-branch keeps each commit's author, committer, dates and tree.
          git filter-branch -f --commit-filter 'git commit-tree -S "$@"' --tag-name-filter cat -- --branches --tags
          # Nothing but the signatures may differ: every branch keeps its exact tree.
          for b in $branches; do
            [ "$(git rev-parse "origin/$b^{tree}")" = "$(git rev-parse "$b^{tree}")" ] || { echo "::error::$b changed"; exit 1; }
          done
          total="$(git rev-list --branches --tags | wc -l)"
          unsigned="$(git log --branches --tags --format='%H %G?' | grep -v ' [GU]$' || true)"
          echo "commits checked: $total"
          if [ -n "$unsigned" ]; then echo "::error::not signed:"; echo "$unsigned"; exit 1; fi
          git log --format='%h %G? %an | %cn | %s' -5 main
          for b in $branches; do git push --force origin "refs/heads/$b:refs/heads/$b"; done
          git push --force origin --tags
          rm -f "$key"
          echo "main after: $(git rev-parse main)"
