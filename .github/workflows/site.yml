# SPDX-License-Identifier: LicenseRef-PolyForm-Shield-1.0.0
# Builds Keeper's website from site/ (plus README.md, CHANGELOG.md, docs/ and the
# screenshots in docs/screenshots) and deploys it with GitHub Pages' own Actions deploy,
# served at https://keeper.ashforde.org/.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions",
# Custom domain: keeper.ashforde.org, Enforce HTTPS on.
#
# The dnf repository (rpm/) and the signing key (keeper-release.asc) are kept on the
# gh-pages branch by release.yml's pages job, which is only storage now: each deploy copies
# them from there into the site, so https://keeper.ashforde.org/rpm/ keeps working. The
# release starts this workflow after it updates them. Nothing here commits anything.
#
# Pushes made with the workflow token start no workflows, so sign-and-land.yml (which moves
# main) starts this one by hand when a landed change touches the site's sources.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'public/favicon.svg'
      - '.github/workflows/site.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The site always shows main (a release event would otherwise check out its tag).
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the website (no dependencies needed)
        run: node site/build.mjs --out "$RUNNER_TEMP/site"
      - name: Add the package repositories from gh-pages
        env:
          SITE: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "No gh-pages branch yet: no package repositories to add."
            exit 0
          fi
          git fetch --depth 1 origin gh-pages
          # Only the paths release.yml's pages job owns; the website itself always comes from main.
          for p in rpm keeper-release.asc KEYS; do
            if git cat-file -e "FETCH_HEAD:$p" 2>/dev/null; then
              git archive FETCH_HEAD "$p" | tar -x -C "$SITE"
              echo "Added $p"
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
