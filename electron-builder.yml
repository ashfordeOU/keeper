appId: io.github.ashfordeou.keeper
productName: Keeper
copyright: Copyright © 2026 Ashforde OÜ · Keeper by Ashforde® · GNU AGPL v3 or later
directories:
  output: release
  buildResources: build
# The main process, preload scripts and most libraries are bundled by esbuild;
# only tesseract.js ships as a module because it starts its own worker threads.
afterPack: build/after-pack.cjs
files:
  - dist/**
  - dist-electron/**
  - '!dist-electron/*.map'
  # The keeper command, run by the installers' shim through the app's own runtime.
  - dist-cli/keeper.cjs
  - '!node_modules/@napi-rs/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/{test,tests,docs,example,examples}/**'
  - build/tray*.png
  - build/icon.png
  - LICENSE
  - package.json
asar: true
# Native pieces are prebuilt per processor (see scripts/prepare-arch.mjs); never recompile them.
npmRebuild: false
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/ffmpeg-static/**
  # Native modules load .node/.dll/.dylib files, which cannot be read from inside the archive.
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**
  # The terminal's pseudo-terminal library (and its macOS spawn helper, which must stay executable).
  - node_modules/node-pty/**
# rclone (MIT) for cloud storage: put in vendor/rclone/current by scripts/fetch-rclone.mjs
# (prepare-arch runs it for the target). Without it Keeper still connects to SFTP, FTP,
# WebDAV and SMB servers; only the cloud services ask for it.
extraResources:
  - from: vendor/rclone/current
    to: rclone
    filter: ['rclone', 'rclone.exe', '*.txt']
# No version in file names, so releases/latest/download/<name> links never go stale.
artifactName: ${productName}-${os}-${arch}.${ext}
# Update information (latest*.yml) points at GitHub Releases; CI builds with
# --publish never and attaches the files itself (see .github/workflows/release.yml).
publish:
  provider: github
  owner: ashfordeOU
  repo: keeper
  releaseType: release
protocols:
  - name: Keeper
    schemes: [keeper]

win:
  icon: build/icon.png
  # The processor comes from the command line (--x64); Windows on ARM runs the x64 build.
  target: [nsis, portable]
  # Shown in the file's Properties → Details.
  legalTrademarks: Ashforde® is a registered trademark of Ashforde OÜ.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Keeper
  # The name in Settings → Apps and the installer's title.
  uninstallDisplayName: Keeper by Ashforde®
  include: build/installer.nsh
  license: LICENSE
  artifactName: ${productName}-setup-${arch}.${ext}
portable:
  artifactName: ${productName}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # One build per processor (--arm64 / --x64), each with its own native libraries.
  target: [dmg, zip]
  # Until a Developer ID is set up the app is ad-hoc signed; see README → First launch.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  extendInfo:
    NSDesktopFolderUsageDescription: Keeper shows and searches the files on your Desktop.
    NSDocumentsFolderUsageDescription: Keeper shows and searches the files in Documents.
    NSDownloadsFolderUsageDescription: Keeper shows your downloads and where they came from.
    NSAppleEventsUsageDescription: Keeper reads what is playing in Music or Spotify and can paste dictated text.
    NSMicrophoneUsageDescription: Keeper listens only while you hold the dictation shortcut.
    LSUIElement: false
  # keeper-helper (native/macos) gives Keeper Apple Intelligence, Live Text and
  # Spotlight. It sits next to the app's executable so it shares the app's
  # identity; builds without it still work, those features just stay off.
  extraFiles:
    - from: native/macos/KeeperHelper/.build/apple/Products/Release/keeper-helper
      to: MacOS/keeper-helper
dmg:
  title: Keeper by Ashforde®
  window: { width: 540, height: 380 }
  sign: false
  contents:
    - { x: 150, y: 190 }
    - { x: 390, y: 190, type: link, path: /Applications }

linux:
  syncDesktopName: true
  icon: build/icon.png
  category: Utility
  synopsis: Keeper by Ashforde® — find, understand and tidy your files
  description: Keeper by Ashforde® is a home for your files — a visual library, plain-English search, text in images, download sources, duplicates, cleanup and a live Island. Ashforde® is a registered trademark of Ashforde OÜ.
  target: [AppImage, deb, rpm, tar.gz]
  desktop:
    entry:
      MimeType: x-scheme-handler/keeper;
      Comment: Keeper by Ashforde® — find, understand and tidy your files
      Actions: Search;Ask;Capture;
    # Right-click Keeper in the dock or app menu. Packages install to /opt/Keeper;
    # AppImage integration tools rewrite these lines to point at the AppImage.
    desktopActions:
      Search:
        Name: Search Files
        Exec: /opt/Keeper/keeper keeper://quick
      Ask:
        Name: Ask Keeper
        Exec: /opt/Keeper/keeper keeper://ask
      Capture:
        Name: Copy Text from Screen
        Exec: /opt/Keeper/keeper keeper://capture
deb:
  depends: [libnotify4, libxtst6, libnss3]
  recommends: [playerctl, xdotool, attr]
# Snap Store build (only made by the release workflow's snap job, when the store credentials exist).
# Classic confinement because Keeper is a file library for the whole home folder and runs helper
# tools (playerctl, xdotool, attr); the store reviews classic snaps once, by hand.
snap:
  confinement: classic
  grade: stable
  summary: Keeper by Ashforde® — find, understand and tidy your files
  artifactName: ${productName}-linux-${arch}.${ext}
